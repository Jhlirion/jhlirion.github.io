ocio</text><text x="830" y="178">BI · Reportes · Indicadores</text><text x="830" y="343">Exploración · Datasets · ML</text></g></g><text x="30" y="421" fill="#b5b5bc" font-family="Arial,sans-serif" font-size="13">Calidad · Gobierno · Trazabilidad · Acceso controlado</text></svg>
